apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Chart.Name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Chart.Name }}

  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}

    spec:
      containers:
      - name: users-service

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 8000
      
      {{- if .Values.env }}
          env:
      {{ toYaml .Values.env | nindent 6 }}
      {{- end }}

        resources:
{{ toYaml .Values.resources | nindent 10 }}