apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: enterprise

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 106551436513.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

          ports:
            - containerPort: 80
